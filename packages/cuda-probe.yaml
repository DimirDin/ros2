# Собственный пакет-проба: минимальная ROS2-нода с CUDA-ядром.
# Нужен потому, что FAST-LIO2 в апстриме CUDA не использует, и без него
# «подтверждение наличия CUDA» сводилось бы к наличию файлов в образе.
#
# Исходники лежат в этом же репозитории, поэтому берутся из build-контекста
# (local_path), а не клонируются по сети: так сборка не зависит ни от имени
# репозитория, ни от того, запушен ли уже текущий коммит.
name: cuda-probe
description: Проверочный ROS2-пакет с CUDA-ядром
local_path: cuda_probe
platforms: [x86-gpu, jetson-agx-jp6, jetson-nano-jp7]
pre_build: cuda-probe-prebuild.sh
apt_deps: []
cmake_args: []
